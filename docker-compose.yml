services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cinebridge
      POSTGRES_PASSWORD: cinebridge
      POSTGRES_DB: cinebridge
    ports:
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebridge -d cinebridge"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    image: cinebridge-recomendacao:av3
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://cinebridge:cinebridge@postgres:5432/cinebridge
      ARMAZENAMENTO: local
      ARMAZENAMENTO_DIR: /app/armazenamento
      PAGAMENTO: stripe
      PROFISSIONAIS: interno
      DECORADORES: auditoria,cache,compressao
      NIVEL_COMPRESSAO: 6
    volumes:
      - arquivos:/app/armazenamento
    command: ["sh", "-c", "npm run db:preparar && npm start"]

volumes:
  dados:
  arquivos:
